name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Verify release version
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -eu
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "menvane-cli"))')
          expected_tag="v${package_version}"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
              printf 'Release tag %s does not match Cargo version %s\n' "$TAG_NAME" "$package_version" >&2
              exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build release
        run: cargo build --release --locked

      - name: Test installer
        run: ./tests/install.sh

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/${TARGET}/release/menvane"
          archive="dist/menvane-${TARGET}.tar.gz"
          mkdir -p dist
          python3 - "$binary" "$archive" <<'PY'
          import gzip
          import io
          import os
          import sys
          import tarfile

          binary_path, archive_path = sys.argv[1:]
          with open(binary_path, "rb") as source:
              content = source.read()
          info = tarfile.TarInfo("menvane")
          info.size = len(content)
          info.mode = 0o755
          info.uid = 0
          info.gid = 0
          info.uname = "root"
          info.gname = "root"
          info.mtime = 0
          with open(archive_path, "wb") as destination:
              with gzip.GzipFile(fileobj=destination, mode="wb", mtime=0) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT) as archive_file:
                      archive_file.addfile(info, io.BytesIO(content))
          os.chmod(archive_path, 0o644)
          PY

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/menvane-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum menvane-*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/menvane-*.tar.gz dist/SHA256SUMS --clobber --repo "$GH_REPO"
          else
              gh release create "$TAG_NAME" dist/menvane-*.tar.gz dist/SHA256SUMS --verify-tag --title "Menvane $TAG_NAME" --generate-notes --repo "$GH_REPO"
          fi
