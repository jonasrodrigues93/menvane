[workspace]
members = [
    "crates/menvane-domain",
    "crates/menvane-store",
    "crates/menvane-engine",
    "crates/menvane-integrations",
    "crates/menvane-server",
    "crates/menvane-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v7"] }
