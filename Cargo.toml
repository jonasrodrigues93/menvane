[workspace]
members = [
    "crates/menvane-domain",
    "crates/menvane-store",
    "crates/menvane-engine",
    "crates/menvane-integrations",
    "crates/menvane-server",
    "crates/menvane-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
getrandom = "0.4"
hex = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
url = "2.5"
webbrowser = "1.0"
uuid = { version = "1.18", features = ["serde", "v7"] }
jsonschema = { version = "0.49", default-features = false }
